<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="404 - Page Not Found">

  <title>404 - Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      font-family: Arial, Helvetica, sans-serif;

      background: #0f172a;
      color: #fff;
    }

    /* Background stars */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        10vw 10vh #fff,
        20vw 80vh #fff,
        30vw 25vh #fff,
        40vw 65vh #fff,
        50vw 15vh #fff,
        60vw 85vh #fff,
        70vw 30vh #fff,
        80vw 70vh #fff,
        90vw 20vh #fff,
        95vw 90vh #fff,
        15vw 50vh #fff,
        75vw 55vh #fff;

      animation: twinkle 3s infinite alternate;
    }

    body::after {
      transform: scale(0.6);
      opacity: 0.5;
      animation-delay: 1s;
    }

    @keyframes twinkle {
      from {
        opacity: 0.2;
      }

      to {
        opacity: 1;
      }
    }

    .error-page {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    /* 404 */
    .error-code {
      position: relative;
      font-size: clamp(100px, 25vw, 230px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -15px;

      color: transparent;

      background: linear-gradient(
        135deg,
        #38bdf8,
        #818cf8,
        #c084fc
      );

      -webkit-background-clip: text;
      background-clip: text;

      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    /* Planet */
    .planet {
      position: absolute;

      width: 90px;
      height: 90px;

      top: 45%;
      left: 50%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #f472b6,
        #8b5cf6
      );

      box-shadow:
        0 0 30px rgba(139, 92, 246, 0.8),
        0 0 70px rgba(139, 92, 246, 0.4);

      animation: planetFloat 4s ease-in-out infinite;
    }

    .planet::before {
      content: "";

      position: absolute;

      width: 130px;
      height: 30px;

      top: 30px;
      left: -20px;

      border: 5px solid rgba(255, 255, 255, 0.6);

      border-radius: 50%;

      transform: rotate(-20deg);
    }

    @keyframes planetFloat {
      0%, 100% {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      50% {
        transform: translate(-50%, -60%) rotate(10deg);
      }
    }

    h1 {
      margin-top: 35px;
      font-size: clamp(28px, 5vw, 48px);
    }

    p {
      margin: 15px auto 30px;
      max-width: 500px;

      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.7;
    }

    /* Button */
    .home-btn {
      display: inline-block;

      padding: 14px 30px;

      color: #fff;
      text-decoration: none;

      font-weight: bold;

      border-radius: 50px;

      background: linear-gradient(
        135deg,
        #6366f1,
        #a855f7
      );

      box-shadow:
        0 10px 30px rgba(99, 102, 241, 0.35);

      transition: 0.3s ease;
    }

    .home-btn:hover {
      transform: translateY(-4px) scale(1.03);

      box-shadow:
        0 15px 40px rgba(168, 85, 247, 0.5);
    }

    /* Astronaut */
    .astronaut {
      position: absolute;

      width: 60px;
      height: 60px;

      right: 8%;
      top: 15%;

      animation: astronaut 6s ease-in-out infinite;
    }

    .astronaut::before {
      content: "👨‍🚀";

      font-size: 55px;
    }

    @keyframes astronaut {
      0% {
        transform: translate(0, 0) rotate(5deg);
      }

      25% {
        transform: translate(30px, -20px) rotate(-10deg);
      }

      50% {
        transform: translate(10px, 30px) rotate(10deg);
      }

      75% {
        transform: translate(-30px, 10px) rotate(-5deg);
      }

      100% {
        transform: translate(0, 0) rotate(5deg);
      }
    }

    /* UFO */
    .ufo {
      position: absolute;

      left: 7%;
      bottom: 15%;

      width: 80px;
      height: 35px;

      background: #94a3b8;

      border-radius: 50%;

      box-shadow:
        0 0 25px rgba(56, 189, 248, 0.7);

      animation: ufo 5s ease-in-out infinite;
    }

    .ufo::before {
      content: "";

      position: absolute;

      width: 35px;
      height: 20px;

      left: 22px;
      top: -10px;

      background: #38bdf8;

      border-radius: 50% 50% 0 0;
    }

    .ufo::after {
      content: "";

      position: absolute;

      width: 60px;
      height: 20px;

      left: 10px;
      bottom: -10px;

      background: rgba(56, 189, 248, 0.3);

      filter: blur(8px);

      border-radius: 50%;
    }

    @keyframes ufo {
      0%, 100% {
        transform: translateX(0) rotate(-3deg);
      }

      50% {
        transform: translateX(80px) rotate(5deg);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {

      .error-code {
        letter-spacing: -8px;
      }

      .planet {
        width: 65px;
        height: 65px;
      }

      .planet::before {
        width: 95px;
        height: 22px;
        left: -15px;
        top: 21px;
      }

      .astronaut {
        right: 2%;
        top: 8%;
      }

      .ufo {
        left: 3%;
        bottom: 8%;
      }

      p {
        font-size: 15px;
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="error-code">
      404
      <div class="planet"></div>
    </div>

    <h1>Oops! Page Not Found</h1>

    <p>
      The page you're looking for seems to have
      disappeared into space. Let's get you back home.
    </p>

    <a href="/" class="home-btn">
      ← Back to Home
    </a>

  </main>

  <div class="astronaut"></div>

  <div class="ufo"></div>

</body>
</html>
