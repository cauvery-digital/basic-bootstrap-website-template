<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>XYZ.com | Your Trusted Online Destination</title>

    <!-- SEO Meta Description -->
    <meta name="description"
          content="Welcome to XYZ.com — your trusted online destination for quality products, services, and useful information.">

    <!-- SEO Keywords -->
    <meta name="keywords"
          content="XYZ.com, online services, quality products, business, website">

    <!-- Author -->
    <meta name="author" content="XYZ.com">

    <!-- Search Engine Robots -->
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.xyz.com/">

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="XYZ.com | Your Trusted Online Destination">
    <meta property="og:description"
          content="Explore XYZ.com for quality products, services, and useful information.">
    <meta property="og:url" content="https://www.xyz.com/">
    <meta property="og:site_name" content="XYZ.com">
    <meta property="og:image" content="https://www.xyz.com/images/og-image.jpg">
    <meta property="og:image:alt" content="XYZ.com website preview">

    <!-- Twitter/X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="XYZ.com | Your Trusted Online Destination">
    <meta name="twitter:description"
          content="Explore XYZ.com for quality products, services, and useful information.">
    <meta name="twitter:image"
          content="https://www.xyz.com/images/og-image.jpg">

    <!-- Preconnect to External Resources (Optional) -->
    <!--
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    -->

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="/" aria-label="XYZ.com Home">
                <strong>XYZ.com</strong>
            </a>

            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/services.html">Services</a></li>
                <li><a href="/contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <h1>Welcome to XYZ.com</h1>

            <p>
                Discover quality products, professional services,
                and useful information at XYZ.com.
            </p>

            <a href="/about.html">Learn More</a>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 XYZ.com. All rights reserved.</p>
    </footer>

</body>
</html>
