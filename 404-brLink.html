<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 - Broken Link</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;

      background: #f5f7fb;
      color: #1d2433;

      overflow: hidden;
    }

    .error-page {
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    /* =========================
       BROKEN LINK
    ========================= */

    .broken-link {
      position: relative;

      width: 280px;
      height: 150px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link {
      position: absolute;

      width: 125px;
      height: 55px;

      border: 12px solid #4f46e5;
      border-radius: 40px;

      transform: rotate(-35deg);

      animation: linkFloat 3s ease-in-out infinite;
    }

    .link-left {
      left: 25px;
    }

    .link-right {
      right: 25px;

      border-color: #8b5cf6;

      transform: rotate(-35deg);
      animation:
        linkFloatRight 3s ease-in-out infinite,
        brokenShake 2s ease-in-out infinite;
    }

    /* Hide the inner part to make it look like a chain */
    .link::after {
      content: "";

      position: absolute;

      width: 80px;
      height: 35px;

      background: #f5f7fb;

      border-radius: 30px;

      top: -2px;
      left: 10px;
    }

    /* Gap between broken links */
    .gap {
      position: absolute;

      width: 55px;
      height: 8px;

      background: #f5f7fb;

      z-index: 5;

      transform: rotate(-35deg);
    }

    /* Small broken pieces */
    .piece {
      position: absolute;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #6366f1;

      opacity: 0;

      animation: pieces 2.5s ease-in-out infinite;
    }

    .piece:nth-child(1) {
      left: 105px;
      top: 45px;
      animation-delay: .1s;
    }

    .piece:nth-child(2) {
      left: 145px;
      top: 70px;
      animation-delay: .5s;
    }

    .piece:nth-child(3) {
      left: 125px;
      top: 90px;
      animation-delay: .9s;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes linkFloat {
      0%, 100% {
        transform: translateX(0) rotate(-35deg);
      }

      50% {
        transform: translateX(-10px) rotate(-38deg);
      }
    }

    @keyframes linkFloatRight {
      0%, 100% {
        transform: translateX(0) rotate(-35deg);
      }

      50% {
        transform: translateX(10px) rotate(-32deg);
      }
    }

    @keyframes brokenShake {
      0%, 100% {
        filter: none;
      }

      48% {
        filter: none;
      }

      50% {
        filter: drop-shadow(0 0 8px rgba(99,102,241,.5));
      }

      52% {
        filter: none;
      }
    }

    @keyframes pieces {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(.3);
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(35px) scale(1);
      }
    }


    /* =========================
       404 NUMBER
    ========================= */

    .error-code {
      font-size: clamp(80px, 18vw, 150px);

      line-height: 1;

      font-weight: 900;

      color: #1f2937;

      letter-spacing: -8px;

      animation: codeFloat 4s ease-in-out infinite;
    }

    .error-code span {
      color: #6366f1;
    }

    @keyframes codeFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }


    /* =========================
       TEXT
    ========================= */

    h1 {
      margin-top: 15px;

      font-size: clamp(28px, 5vw, 42px);
    }

    .description {
      max-width: 500px;

      margin: 15px auto 0;

      color: #6b7280;

      font-size: 17px;

      line-height: 1.7;
    }


    /* =========================
       BUTTON
    ========================= */

    .home-button {
      display: inline-block;

      margin-top: 28px;

      padding: 14px 30px;

      background: #4f46e5;

      color: #fff;

      text-decoration: none;

      border-radius: 8px;

      font-weight: 600;

      transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
    }

    .home-button:hover {
      background: #4338ca;

      transform: translateY(-4px);

      box-shadow:
        0 12px 25px rgba(79, 70, 229, .25);
    }


    /* =========================
       DECORATIVE DASHES
    ========================= */

    .dash {
      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #a5b4fc;

      animation: dashFloat 3s ease-in-out infinite;
    }

    .dash.one {
      top: 20%;
      left: 15%;
    }

    .dash.two {
      top: 70%;
      left: 12%;

      animation-delay: .7s;
    }

    .dash.three {
      top: 25%;
      right: 15%;

      animation-delay: 1.2s;
    }

    .dash.four {
      bottom: 15%;
      right: 18%;

      animation-delay: .4s;
    }

    @keyframes dashFloat {
      0%, 100% {
        transform: translateY(0);
        opacity: .4;
      }

      50% {
        transform: translateY(-15px);
        opacity: 1;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .broken-link {
        transform: scale(.8);
        margin-bottom: 0;
      }

      .error-code {
        letter-spacing: -5px;
      }

      .description {
        font-size: 15px;
      }
    }


    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- Decorative elements -->
  <span class="dash one"></span>
  <span class="dash two"></span>
  <span class="dash three"></span>
  <span class="dash four"></span>


  <main class="error-page">

    <!-- Broken Link Animation -->
    <div class="broken-link">

      <div class="link link-left"></div>

      <div class="gap"></div>

      <div class="link link-right"></div>

      <span class="piece"></span>
      <span class="piece"></span>
      <span class="piece"></span>

    </div>


    <!-- Error Code -->
    <div class="error-code">
      4<span>0</span>4
    </div>


    <h1>
      Broken Link
    </h1>


    <p class="description">
      It looks like this link has broken apart.
      The page you're looking for doesn't exist
      or may have been moved.
    </p>


    <a href="/" class="home-button">
      ← Back to Home
    </a>

  </main>

</body>
</html>
